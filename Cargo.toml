[package]
name = "dpi_guard"
version = "0.1.0"
edition = "2021"
description = "Modular DPI evasion engine (SNI mutation, fragmentation, TCP fooling, stealth, strategy scoring). Windows-only packet I/O via WinDivert."
license = "MIT"

[lib]
name = "dpi_guard"
path = "src/lib.rs"

[[bin]]
name = "dpi_guard"
path = "src/main.rs"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
dashmap = "=5.5.3"
indexmap = "=2.2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"
# Native desktop settings window (no browser/Web UI required).
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util"] }
thiserror = "1"
# DNS-over-HTTPS resolution for relay mode (no plaintext DNS leak).
# TLS is rustls via ureq's default "tls" feature.
# ureq is used for DoH resolution (essential) and optional self-update.
# The self-update module is gated behind the ureq dependency since it's
# the only HTTP client in the crate. Keeping it lean: only rustls TLS.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# TCP keepalive on relay upstream sockets (already a tokio transitive dep).
socket2 = "0.5"

[target.'cfg(windows)'.dependencies]
windivert = { version = "0.5", features = ["vendored"] }

[profile.release]
# catch_unwind in fail_open requires unwind. abort would black-hole packets.
panic = "unwind"
# Integer overflow in length math must panic (caught by fail-open) rather
# than wrap into an out-of-bounds splice on the live packet path.
overflow-checks = true
# The packet path (pipeline.rs::handle) runs once per captured packet, so
# real perf comes from letting the optimizer inline and dedupe across the
# whole crate graph rather than per-codegen-unit. LTO + codegen-units = 1
# cost extra build time (worth it — this is not built often) in exchange
# for a measurably tighter release binary on the hot path.
lto = true
codegen-units = 1
